spring.application.name=thulya-backend
server.port=8080
server.servlet.context-path=/

# ---- MongoDB ----
# Override with env vars in production (SPRING_DATA_MONGODB_URI).
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/thulya}
spring.data.mongodb.auto-index-creation=true

# ---- JWT ----
# In production set THULYA_JWT_SECRET to a long random value (>= 32 bytes).
thulya.jwt.secret=${THULYA_JWT_SECRET:change-me-thulya-dev-secret-key-please-rotate-in-prod-0001}
thulya.jwt.access-ttl-minutes=120
thulya.jwt.refresh-ttl-days=30

# ---- Seeding ----
# When true, DataSeeder loads sample catalogue/tailoring data on empty collections.
thulya.seed.enabled=${THULYA_SEED:true}

# ---- Integrations (placeholders; wired in later slices) ----
thulya.whatsapp.number=910000000000
thulya.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_placeholder}

# ---- JSON / logging ----
spring.jackson.default-property-inclusion=non_null
logging.level.com.thulya=INFO
