spring.application.name=spring-ai-example
server.port=8084

# Anthropic API key - read from the environment, never commit a real key
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}

# Claude model and response limit
spring.ai.anthropic.chat.model=claude-opus-5-5
spring.ai.anthropic.chat.max-tokens=4096
